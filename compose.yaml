name: evidenceos
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # PostgreSQL is reachable only from other Compose services via db:5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # OIDC sessions live solely on the private network; no published port.
    environment:
      REDIS_PASSWORD: ${EVIDENCEOS_SESSION_REDIS_PASSWORD:-local-development-only-redis-secret-012345678901}
    command:
      - sh
      - -c
      - exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      EVIDENCEOS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      EVIDENCEOS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      EVIDENCEOS_APP_ENV: ${EVIDENCEOS_APP_ENV:-development}
      EVIDENCEOS_SECURITY_MODE: ${EVIDENCEOS_SECURITY_MODE:-local}
      EVIDENCEOS_API_SERVICE_TOKEN: ${EVIDENCEOS_API_SERVICE_TOKEN:-}
      EVIDENCEOS_OIDC_ISSUER: ${EVIDENCEOS_OIDC_ISSUER:-}
      EVIDENCEOS_OIDC_AUDIENCE: ${EVIDENCEOS_OIDC_AUDIENCE:-}
      EVIDENCEOS_OIDC_JWKS_URL: ${EVIDENCEOS_OIDC_JWKS_URL:-}
      EVIDENCEOS_RATE_LIMIT_ENABLED: ${EVIDENCEOS_RATE_LIMIT_ENABLED:-false}
      EVIDENCEOS_RATE_LIMIT_REDIS_URL: ${EVIDENCEOS_RATE_LIMIT_REDIS_URL:-}
      EVIDENCEOS_RATE_LIMIT_REDIS_PASSWORD: ${EVIDENCEOS_RATE_LIMIT_REDIS_PASSWORD:-}
      EVIDENCEOS_RATE_LIMIT_REQUESTS_PER_MINUTE: ${EVIDENCEOS_RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      EVIDENCEOS_RATE_LIMIT_EXPENSIVE_PER_MINUTE: ${EVIDENCEOS_RATE_LIMIT_EXPENSIVE_PER_MINUTE:-12}
    ports:
      - "127.0.0.1:${EVIDENCEOS_API_HOST_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      BACKEND_API_URL: http://api:8000
      EVIDENCEOS_APP_ENV: ${EVIDENCEOS_APP_ENV:-development}
      EVIDENCEOS_SECURITY_MODE: ${EVIDENCEOS_SECURITY_MODE:-local}
      EVIDENCEOS_API_SERVICE_TOKEN: ${EVIDENCEOS_API_SERVICE_TOKEN:-}
      EVIDENCEOS_WEB_USERNAME: ${EVIDENCEOS_WEB_USERNAME:-}
      EVIDENCEOS_WEB_PASSWORD: ${EVIDENCEOS_WEB_PASSWORD:-}
      EVIDENCEOS_OIDC_ISSUER: ${EVIDENCEOS_OIDC_ISSUER:-}
      EVIDENCEOS_OIDC_AUDIENCE: ${EVIDENCEOS_OIDC_AUDIENCE:-}
      EVIDENCEOS_OIDC_WEB_CLIENT_ID: ${EVIDENCEOS_OIDC_WEB_CLIENT_ID:-}
      EVIDENCEOS_OIDC_WEB_CLIENT_SECRET: ${EVIDENCEOS_OIDC_WEB_CLIENT_SECRET:-}
      EVIDENCEOS_WEB_SESSION_KEY: ${EVIDENCEOS_WEB_SESSION_KEY:-}
      EVIDENCEOS_SESSION_REDIS_URL: ${EVIDENCEOS_SESSION_REDIS_URL:-redis://redis:6379}
      EVIDENCEOS_SESSION_REDIS_PASSWORD: ${EVIDENCEOS_SESSION_REDIS_PASSWORD:-}
      EVIDENCEOS_WEB_ORIGIN: ${EVIDENCEOS_WEB_ORIGIN:-http://127.0.0.1:3001}
    ports:
      - "127.0.0.1:${EVIDENCEOS_WEB_HOST_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/auth/health').then(r => process.exit((r.ok || r.status === 401) ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
volumes:
  postgres_data:
