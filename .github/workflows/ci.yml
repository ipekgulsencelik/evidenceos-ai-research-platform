name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/pyproject.toml
      - name: Install Python
        run: uv python install 3.12
      - name: Sync pinned dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Tests and coverage
        run: uv run pytest --cov=evidenceos --cov-report=term-missing --cov-fail-under=80

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evidenceos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: evidenceos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidenceos -d evidenceos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      EVIDENCEOS_APP_ENV: test
      EVIDENCEOS_TEST_DATABASE_URL: postgresql+asyncpg://evidenceos:ci-only-password@127.0.0.1:5432/evidenceos_test
      EVIDENCEOS_DATABASE_URL: postgresql+asyncpg://evidenceos:ci-only-password@127.0.0.1:5432/evidenceos_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync
      - name: Apply migration
        run: uv run alembic upgrade head
      - name: PostgreSQL tests
        run: uv run pytest tests/test_postgres.py

  web:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit web dependencies for high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Check TypeScript and unit tests
        run: npm run check
      - name: Parse gated real-provider browser scenario
        run: |
          node --check e2e/oidc-provider.spec.mjs
          node --check playwright.staging.config.mjs
      - name: Redis session integration
        run: npm run test:redis
        env:
          EVIDENCEOS_REDIS_TEST_URL: redis://127.0.0.1:6379
      - name: Build Next.js application
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and protected Redis service
        run: |
          cp .env.example .env
          trap 'docker compose down --remove-orphans' EXIT
          docker compose config --quiet
          docker compose up -d --wait redis
          docker compose exec -T redis sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG'
          docker compose exec -T redis sh -c 'redis-cli ping | grep -q NOAUTH'
      - name: Check isolated OIDC staging contracts and Compose syntax
        env:
          STAGING_POSTGRES_PASSWORD: ci-only-staging-placeholder
          STAGING_REDIS_PASSWORD: ci-only-staging-placeholder-for-redis-123456
          STAGING_KEYCLOAK_ADMIN_PASSWORD: ci-only-staging-placeholder
          STAGING_OIDC_WEB_CLIENT_SECRET: ci-only-staging-placeholder-for-web-client
          STAGING_WEB_SESSION_KEY: ci-only-staging-placeholder-for-session-key-012345
        run: |
          python -m unittest discover -s scripts -p 'test_oidc_staging.py' -v
          docker compose -f compose.oidc-staging.yaml config --quiet
      - name: Build API image
        run: docker build -t evidenceos-api:ci apps/api
      - name: Build Web image
        run: docker build -t evidenceos-web:ci apps/web
