name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/pyproject.toml
      - name: Install Python
        run: uv python install 3.12
      - name: Sync pinned dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Tests and coverage
        run: uv run pytest --cov=evidenceos --cov-report=term-missing --cov-fail-under=80

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evidenceos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: evidenceos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidenceos -d evidenceos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      EVIDENCEOS_APP_ENV: test
      EVIDENCEOS_TEST_DATABASE_URL: postgresql+asyncpg://evidenceos:ci-only-password@127.0.0.1:5432/evidenceos_test
      EVIDENCEOS_DATABASE_URL: postgresql+asyncpg://evidenceos:ci-only-password@127.0.0.1:5432/evidenceos_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync
      - name: Apply migration
        run: uv run alembic upgrade head
      - name: PostgreSQL tests
        run: uv run pytest tests/test_postgres.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript and unit tests
        run: npm run check
      - name: Build Next.js application
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t evidenceos-api:ci apps/api
      - name: Build Web image
        run: docker build -t evidenceos-web:ci apps/web
