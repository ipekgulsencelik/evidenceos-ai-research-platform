name: Generate Redis dependency lock (temporary)
on:
  push:
    branches: [feat/central-session-revocation]
    paths:
      - apps/web/package.json
      - .github/workflows/sync-session-lock-temporary.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve npm lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git diff --cached --quiet || git commit -m "build(web): lock redis session dependency"
          git push
