[project]
name = "evidenceos-api"
version = "0.1.0"
description = "EvidenceOS research platform foundation API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "SQLAlchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "httpx>=0.27,<1.0",
  "pypdf>=5.9,<7.0",
  "python-multipart>=0.0.20,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
  "aiosqlite>=0.20,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidenceos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: tests that exercise persistence adapters"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unused_configs = true

[tool.coverage.run]
source = ["evidenceos"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
