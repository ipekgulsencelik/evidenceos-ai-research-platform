# Explicitly isolated from compose.yaml: different project, services and volumes.
# Launch only with:
# docker compose --env-file .env.oidc-staging -f compose.oidc-staging.yaml up -d --build
name: evidenceos-oidc-staging

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evidenceos_staging
      POSTGRES_USER: staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Generate .env.oidc-staging first}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging -d evidenceos_staging"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${STAGING_REDIS_PASSWORD:?Generate .env.oidc-staging first}
    command: ["sh", "-c", "exec redis-server --save \"\" --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 15

  idp:
    image: quay.io/keycloak/keycloak:26.8.2
    command:
      - start-dev
      - --hostname=https://idp.localhost:8443
      - --https-port=8443
      - --http-enabled=false
      - --https-certificate-file=/opt/keycloak/conf/tls/idp.pem
      - --https-certificate-key-file=/opt/keycloak/conf/tls/idp-key.pem
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: staging-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${STAGING_KEYCLOAK_ADMIN_PASSWORD:?Generate .env.oidc-staging first}
    volumes:
      - ./staging/runtime/idp.pem:/opt/keycloak/conf/tls/idp.pem:ro
      - ./staging/runtime/idp-key.pem:/opt/keycloak/conf/tls/idp-key.pem:ro
      - # Keycloak requires <realm-name>-realm.json at the import target.
      - ./staging/runtime/evidenceos-realm.json:/opt/keycloak/data/import/evidenceos-staging-realm.json:ro
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      default:
        aliases:
          - idp.localhost

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      EVIDENCEOS_DATABASE_URL: postgresql+asyncpg://staging:${STAGING_POSTGRES_PASSWORD:?}@db:5432/evidenceos_staging
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      EVIDENCEOS_APP_ENV: test
      EVIDENCEOS_SECURITY_MODE: oidc
      EVIDENCEOS_DATABASE_URL: postgresql+asyncpg://staging:${STAGING_POSTGRES_PASSWORD:?}@db:5432/evidenceos_staging
      EVIDENCEOS_OIDC_ISSUER: https://idp.localhost:8443/realms/evidenceos-staging
      EVIDENCEOS_OIDC_AUDIENCE: evidenceos-api-staging
      EVIDENCEOS_OIDC_JWKS_URL: https://idp.localhost:8443/realms/evidenceos-staging/protocol/openid-connect/certs
      SSL_CERT_FILE: /opt/staging-certs/rootCA.pem
    volumes:
      - ./staging/runtime/rootCA.pem:/opt/staging-certs/rootCA.pem:ro
    ports:
      - "127.0.0.1:8101:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      idp:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      BACKEND_API_URL: http://api:8000
      EVIDENCEOS_APP_ENV: test
      EVIDENCEOS_SECURITY_MODE: oidc
      EVIDENCEOS_OIDC_ISSUER: https://idp.localhost:8443/realms/evidenceos-staging
      EVIDENCEOS_OIDC_AUDIENCE: evidenceos-api-staging
      EVIDENCEOS_OIDC_WEB_CLIENT_ID: evidenceos-web-staging
      EVIDENCEOS_OIDC_WEB_CLIENT_SECRET: ${STAGING_OIDC_WEB_CLIENT_SECRET:?Generate .env.oidc-staging first}
      EVIDENCEOS_WEB_SESSION_KEY: ${STAGING_WEB_SESSION_KEY:?Generate .env.oidc-staging first}
      EVIDENCEOS_WEB_ORIGIN: http://127.0.0.1:3101
      EVIDENCEOS_SESSION_REDIS_URL: redis://redis:6379
      EVIDENCEOS_SESSION_REDIS_PASSWORD: ${STAGING_REDIS_PASSWORD:?Generate .env.oidc-staging first}
      NODE_EXTRA_CA_CERTS: /opt/staging-certs/rootCA.pem
    volumes:
      - ./staging/runtime/rootCA.pem:/opt/staging-certs/rootCA.pem:ro
    ports:
      - "127.0.0.1:3101:3000"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/auth/health').then(r => process.exit(r.ok || r.status === 401 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  staging_postgres_data:
